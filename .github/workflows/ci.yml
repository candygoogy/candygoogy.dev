name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Daily, so a build that breaks on its own (a font re-released upstream,
  # an outside service down) shows up as a failed run and an email. These
  # runs also check the build-time data strictly (DATA_STRICT on the data
  # step): GitHub data, avatar or icons that fell back fail the run.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  # Per event too, so a push never cancels the daily strict run (or the
  # other way round).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # These two steps are package.json's build, split so that only the
      # data scripts see the token, not every build script and dependency.
      - run: npm run data
        env:
          # The data scripts warn and fall back on push and pull requests;
          # only the scheduled run fails on a fallback.
          DATA_STRICT: ${{ github.event_name == 'schedule' && '1' || '' }}
          # Sent only to the GitHub REST API, for release lookups.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx astro build
      # The browser is kept between runs, keyed by Playwright's version; the
      # system libraries it needs are installed every time.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e

  # Workers Builds deploys the deploy branch, not main, so a push goes live
  # only once every check above has passed on it. A later push cancels an
  # earlier run, and its own run then moves the branch past both commits.
  # The Worker cron's daily rebuild builds whatever the branch holds.
  release:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A plain push only fast-forwards: if deploy ever holds a commit main
      # doesn't, this fails instead of overwriting it.
      - run: git push origin HEAD:refs/heads/deploy

  # The daily rebuild deploys from a Worker cron, whose failures reach only
  # the Workers logs, and the job above builds without deploying. This checks
  # what is actually live, an hour after that rebuild, so a deploy that
  # didn't happen (or went out with old data) fails a run and sends an email.
  live:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # actions: the CI run that moved deploy, for when it moved.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Built-ins only: no npm ci.
      - run: node scripts/check-live.mjs
        env:
          # Sent only to the GitHub REST API, for the deploy branch's tip
          # and the run that moved it there.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
